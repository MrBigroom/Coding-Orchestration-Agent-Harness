[project]
name = "coding-orchestrator"
version = "0.1.0"
description = "Local-first coding orchestration harness: Architect/Supervisor/Worker build loop over CLI coding agents and model APIs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "external: requires an external CLI harness or network; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W"]
ignore = [
  "S101",  # assert in tests
  "S603",  # subprocess without shell — we never use shell=True and pass argv lists
  "S607",  # partial executable path — binaries are resolved via PATH by design
  "B008",  # FastAPI/Typer default-call idiom
  "S311",  # non-crypto random is fine for short ids
  "UP047", # keep TypeVar generics (readable on 3.12)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501", "S603", "S607"]
"src/orchestrator/migrations/**" = ["E501", "W291"]
"src/orchestrator/prompts/**" = ["E501"]
