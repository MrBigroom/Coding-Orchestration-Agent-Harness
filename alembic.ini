# Alembic config for manual use: `alembic upgrade head` from the repo root.
# The orchestrator CLI configures Alembic programmatically and ignores this file's URL;
# the DB URL here falls back to ORCHESTRATOR_DB_URL / ORCHESTRATOR_HOME when empty.
[alembic]
script_location = src/orchestrator/migrations
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
